name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (shellcheck + hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck kind scripts
        run: shellcheck kind/*.sh

      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: hadolint airflow Dockerfile
        run: hadolint images/airflow/Dockerfile

  python-tests:
    name: Pipeline loader tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest "httpx==0.28.1"

      - name: pytest
        run: python -m pytest -q tests

  image-airflow:
    name: Build + push airflow demo image
    runs-on: ubuntu-latest
    # Only on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, python-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ghcr.io/stardelt/airflow:demo
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/airflow/Dockerfile
          push: true
          tags: ghcr.io/stardelt/airflow:demo
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The push job above runs only on main, so without this a pull request would merge an
  # image that has never been built.
  image-airflow-check:
    name: Build airflow demo image (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ghcr.io/stardelt/airflow:demo (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/airflow/Dockerfile
          push: false
          cache-from: type=gha
